name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Tests need no secrets or network: Claude is mocked and XRPL keys are generated offline.
      - run: python -m pytest -q tests/test_agent.py tests/test_cosign.py tests/test_dashboard.py tests/test_policy.py tests/test_privy_wallet.py
